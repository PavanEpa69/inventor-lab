name: CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: Secret scan (whole repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan every tracked file
        run: python3 scripts/scan_secrets.py

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -t .
